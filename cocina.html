<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H52 | Cocina</title>
  <link rel="stylesheet" href="staff.css">

  <script defer src="config/backend.js"></script><script defer src="h52-backend.js"></script><script defer src="staff.js"></script>
</head>
<body data-role="kitchen">
  <header class="staff-header"><a class="brand" href="index.html">H52</a><nav class="staff-nav"><a href="mozo.html">Mozos</a><a class="active" href="cocina.html">Cocina</a><a href="index.html">Carta</a><span id="mode" class="pill">Conectando</span></nav></header>
